repos:
  - repo: local
    hooks:
      - id: link-agent-skills
        name: Sync agent skill symlinks
        entry: bash -c 'set -e; .agents/scripts/link-skills.sh; unstaged="$(git ls-files --others --exclude-standard -- .claude/skills .cursor/skills)"; [ -z "$unstaged" ] || { echo "Unstaged skill links (git add them):"; echo "$unstaged"; exit 1; }'
        language: system
        always_run: true
        pass_filenames: false
      - id: check-agent-mcp
        name: Verify MCP adapters are current
        entry: .agents/scripts/sync-mcp.sh check
        language: script
        always_run: true
        pass_filenames: false
      - id: trailing-whitespace
        name: Reject trailing whitespace outside vendored skills
        entry: bash -c '! git grep -nI -E "[[:blank:]]+$" -- . ":(exclude).agents/skills/**"'
        language: system
        always_run: true
        pass_filenames: false
