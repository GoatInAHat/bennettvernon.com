# Lint, typecheck/build, and run the physics self-checks. Pushes to main get
# the same build through the Pages deploy, so this only needs pull requests.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Force-law anti-drift check
        run: npm run check:force
      - name: Density steady-state check
        run: npm run check:density
